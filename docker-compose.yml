services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: authz
      POSTGRES_PASSWORD: authz  # local demo only
      POSTGRES_DB: authz
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./db/schema.sql:/schema/schema.sql:ro
    healthcheck:
      # TCP check: only passes after init scripts finish (init runs socket-only)
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "authz", "-d", "authz_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://authz:authz@db:5432/authz
      TEST_DATABASE_URL: postgresql://authz:authz@db:5432/authz_test
      API_URL: http://app:8000
    ports: ["${API_PORT:-8000}:8000"]  # API_PORT=8080 make up, if 8000 is taken
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./pyproject.toml:/app/pyproject.toml
    depends_on:
      db:
        condition: service_healthy
